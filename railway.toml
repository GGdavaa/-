# ──────────────────────────────────────────────────────────────────
# Railway configuration — https://docs.railway.app/reference/config-as-code
# ──────────────────────────────────────────────────────────────────

[build]
builder        = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand   = "./cognitum-api"
healthcheckPath    = "/health"
healthcheckTimeout = 30
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ──────────────────────────────────────────────────────────────────
# Environment variable defaults (override in Railway dashboard)
# ──────────────────────────────────────────────────────────────────
# Required secrets — set these in the Railway dashboard:
#   DATABASE_URL   postgresql://...   (add a Postgres plugin)
#   REDIS_URL      redis://...        (add a Redis plugin)
#   JWT_SECRET     <random 64-char>
#
# Optional overrides (sensible defaults shown):
#   HOST                               0.0.0.0
#   PORT                               (Railway sets this automatically)
#   RUST_LOG                           info,cognitum=debug
#   DATABASE_MAX_CONNECTIONS           100
#   DATABASE_CONNECTION_TIMEOUT        30
#   REDIS_POOL_SIZE                    10
#   REDIS_TIMEOUT                      5
#   JWT_ACCESS_TOKEN_TTL               900
#   JWT_REFRESH_TOKEN_TTL              604800
#   RATE_LIMIT_REQUESTS_PER_MINUTE     100
#   RATE_LIMIT_BURST                   20
#   ENABLE_CORS                        true
#   CORS_ALLOWED_ORIGINS               *
#   ENABLE_METRICS                     true
#   ENABLE_TRACING                     true
#   ENABLE_API_DOCS                    true
