# ──────────────────────────────────────────────────────────────────
# Local development stack — mirrors Railway services
# Usage: docker compose up
# ──────────────────────────────────────────────────────────────────
version: "3.9"

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://cognitum:secret@postgres:5432/cognitum
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      RUST_LOG: info,cognitum=debug
      ENABLE_CORS: "true"
      ENABLE_METRICS: "true"
      ENABLE_TRACING: "true"
      ENABLE_API_DOCS: "true"
      RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
      RATE_LIMIT_BURST: "20"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cognitum
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cognitum
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitum"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
